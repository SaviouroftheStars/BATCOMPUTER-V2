<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewpoint" content="width=device-width, initial-scale=1">
    <title>Wayne Systems// Batcomputer</title>
    <link rel="stylesheet" href="batcomputer.css">
  </head>
  <body>
    <section id="loginScreen" class="screen login-screen">
      <div class="login-wrap">
        <h1>SECURE TERMINAL</h1>
        <p class="eyebrow">AUTHORIZED ACCESS ONLY</p>
        <div id="loginForm" class="login-box">
          <label>USER</label>
          <div class="login-display-field">BATMAN</div>

          <label>PASSWORD</label>
          <div
            id="passwordDisplay"
            class="login-display-field login-password-display"
            aria-label="Password entered"
            ></div>

          <button id="authenticateButton" type="button" disabled>
            AUTHENTICATE
          </button>

          <div id="passwordStatus" class="passwordstatus">
            ENTERNING CREDENTIALS
      </div>
    </section>
    <script src="batcomputer.js"></script>
  </body>
  </html>
